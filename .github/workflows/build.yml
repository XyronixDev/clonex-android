name: CloneX — Build Release APK

# v3.0: builds the NewBlackbox engine (Bcore AAR) first, then the CloneX APK.
#
#  1. JDK 21: clone ALEX5402/NewBlackbox at the pinned commit, apply the
#     MaxCloner split-APK patch (tools/patch-bcore-split.py), build
#     :Bcore:assembleRelease with the repo's own Gradle wrapper
#     (8.14.5, NDK 29.0.13846066, compileSdk 35). The AAR goes to
#     app/libs/bcore-release.aar.
#  2. JDK 21: Gradle 9.8.2 builds the CloneX release APK (AGP 9.5.0).
#
# The APK is delivered as a workflow artifact — download it from the
# Actions tab. No zip is published from the chat.
#
# SIGNING (optional but recommended for a real release):
# Add these 4 repository Secrets (Settings > Secrets and variables >
# Actions) and the workflow signs the APK with V1+V2+V3+V4:
#   ANDROID_KEYSTORE_BASE64  - base64 of the release .jks file
#                              (base64 -w0 clonex-release.jks)
#   CLONEX_STORE_PASSWORD    - keystore password
#   CLONEX_KEY_ALIAS         - key alias (clonex-release)
#   CLONEX_KEY_PASSWORD      - key password
# Without the secrets the build still succeeds and uploads an UNSIGNED
# release APK (installable only after local signing). The keystore and
# passwords are NEVER committed to the repo (see .gitignore).
#
# NOTE: this workflow file cannot be pushed through the GitHub API
# (403 for workflow files) — it is uploaded through the browser UI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for hours if a step stalls again.
    # 60 min so a genuinely slow (but progressing) engine build can
    # finish; the Bcore step below has its own 20-min fail-fast cap.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 is for both builds: the Bcore AAR (Gradle 8.14.5) and the
      # CloneX APK (AGP 9.5.0 / Gradle 9.8.2).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # NOTE: run #2's "stuck on Provision Gradle" was a stale live-log
      # view — setup-gradle had actually finished in 22s. Gradle is
      # still downloaded directly here (curl retries, fails fast, log
      # shows real progress) instead of the setup action.
      - name: Install Gradle 9.8.2 (direct download)
        timeout-minutes: 10
        run: |
          cd "$RUNNER_TEMP"
          curl -L --retry 3 --retry-delay 5 --max-time 300 \
            -o gradle-9.8.2-bin.zip \
            https://services.gradle.org/distributions/gradle-9.8.2-bin.zip
          unzip -q gradle-9.8.2-bin.zip
          echo "$RUNNER_TEMP/gradle-9.8.2/bin" >> "$GITHUB_PATH"
          gradle --version

      # FIX (run #2 failed, exit 127): `sdkmanager` is NOT on the
      # runner's PATH. It lives under
      # $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager, so resolve it
      # by full path — and install cmdline-tools first if it is absent.
      # ANDROID_HOME is exported to later steps (build + apksigner).
      # v3.0: installs API 37.0 + build-tools 37.0.0 (CloneX, compileSdk
      # 37) and API 35 + NDK 29.0.13846066 (Bcore, compileSdk 35 and its
      # pinned ndkVersion).
      - name: Install Android SDKs (API 37.0 + API 35 + NDK 29)
        timeout-minutes: 15
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "cmdline-tools not found — installing them."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$RUNNER_TEMP"
            curl -L --retry 3 --retry-delay 5 --max-time 300 \
              -o cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          "$SDKMANAGER" "platforms;android-35" "ndk;29.0.13846066"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          ls "$ANDROID_HOME/platforms/"
          ls "$ANDROID_HOME/ndk/"

      # --- v3.0 engine: NewBlackbox (Bcore) --------------------------------
      # Clone at the pinned commit (HEAD 2026-07-19, verified 2026-11-07)
      # and apply the MaxCloner split-APK patch. The patch script verifies
      # itself (byte-identical files + AntiDetection line) and exits
      # non-zero on any failure, so a bad patch fails the build here
      # instead of shipping a broken engine.
      - name: Clone NewBlackbox + apply split patch
        run: |
          git clone https://github.com/ALEX5402/NewBlackbox.git newblackbox
          cd newblackbox
          git checkout 89b59836c66f173756a4ae258cf379a957649820
          cd "$GITHUB_WORKSPACE"
          python3 tools/patch-bcore-split.py newblackbox

      # The Bcore build uses the repo's own gradlew (Gradle 8.14.5,
      # AGP 8.13.2) under JDK 21. The native build (ndk-build, arm64 +
      # armeabi-v7a) is the slow part — 20-min step timeout fails fast
      # instead of eating the whole job timeout.
      - name: Build Bcore AAR (JDK 21, Gradle 8.14.5)
        timeout-minutes: 20
        run: |
          cd newblackbox
          chmod +x gradlew
          ./gradlew :Bcore:assembleRelease --console=plain --stacktrace
          ls -la Bcore/build/outputs/aar/
          test -f Bcore/build/outputs/aar/Bcore-release.aar

      # v3.0 fix (run #94): Bcore's classes reference the black-reflection
      # module (top.niunaijun.blackreflection.*) at runtime, but the AAR
      # does not bundle it — it is a plain java-library module producing
      # a JAR. Build it here so R8 sees the real classes (a -dontwarn
      # would hide a runtime dependency the engine needs live).
      - name: Build black-reflection JAR (JDK 21, Gradle 8.14.5)
        timeout-minutes: 10
        run: |
          cd newblackbox
          ./gradlew :black-reflection:jar --console=plain --stacktrace
          ls -la black-reflection/build/libs/
          test -f black-reflection/build/libs/black-reflection.jar

      - name: Copy engine AAR + black-reflection JAR into CloneX
        run: |
          mkdir -p app/libs
          cp newblackbox/Bcore/build/outputs/aar/Bcore-release.aar app/libs/bcore-release.aar
          cp newblackbox/black-reflection/build/libs/black-reflection.jar app/libs/black-reflection.jar
          echo "--- app/libs ---"
          ls -la app/libs/

      - name: Prepare signing (only if keystore secret is set)
        # NOTE: GitHub Actions does NOT allow the `secrets` context inside
        # an `if:` expression (validation error: "Unrecognized named-value:
        # 'secrets'"). So this step always runs and checks inside bash:
        # empty secret = skip signing, build stays unsigned.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLONEX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLONEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLONEX_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set — building unsigned release APK."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/clonex-release.jks"
          cat > local.properties <<EOF
          CLONEX_STORE_FILE=$GITHUB_WORKSPACE/clonex-release.jks
          CLONEX_STORE_PASSWORD=$STORE_PASSWORD
          CLONEX_KEY_ALIAS=$KEY_ALIAS
          CLONEX_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          echo "Signing configured from GitHub Secrets."

      - name: Build release APK (arm64-only)
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signatures (V1/V2/V3/V4)
        # Unsigned MVP builds fail apksigner verify by design — do not
        # fail the whole job for that; report it and still upload the APK.
        continue-on-error: true
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" || echo "NOTE: APK is unsigned (no keystore secrets set) — install needs local signing."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneX-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.idsig
          if-no-files-found: error

      - name: Upload R8 mapping (for crash debugging)
        uses: actions/upload-artifact@v4
        with:
          name: CloneX-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
